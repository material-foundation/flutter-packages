# Checks that are run on every commit to main and every pull request.
name: Checks

on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  check_package:
    name: ${{ matrix.package }} using Flutter ${{ matrix.flutter-channel }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package: [dynamic_color]
        flutter-channel: [stable, beta]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ matrix.flutter-channel }}
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Get packages
        run: flutter pub get
        working-directory: packages/${{ matrix.package }}

      - name: Analyze Dart code
        id: analyze
        continue-on-error: true
        run: flutter analyze
        working-directory: packages/${{ matrix.package }}

      - name: Report analysis warnings
        if: steps.analyze.outcome == 'failure'
        run: echo "::warning::Flutter analyze reported issues; continuing without failing the check."

      - name: Ensure Dart code is formatted correctly
        run: dart format --set-exit-if-changed .
        working-directory: packages/${{ matrix.package }}

      - name: Run Flutter unit tests
        run: flutter test
        working-directory: packages/${{ matrix.package }}
